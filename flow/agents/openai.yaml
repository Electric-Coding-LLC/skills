interface:
  display_name: "Flow"
  short_description: "Autonomous delivery flow with plan tracking"
  default_prompt: "Use $flow to take this work from scoped implementation through $slop, $review, and $sendit automatically, keeping any existing repo plan doc, EXECMAP, or checklist updated as progress changes. Before $sendit, sync mechanically obvious planning/progress status so it is included in the delivery commit. Treat invocation of $flow as authorization to open, merge, and clean up the PR once review and CI gates are satisfied."

interface:
  display_name: "Superflow"
  short_description: "Supervised version flow with live progress sync"
  default_prompt: "Use $superflow to gather the current roadmap version or project goal, build or update the execmap, handle UI design before implementation when direction is unclear or high-impact, create wireframes only when they materially clarify execution, complete the mapped work under $supervisor, run $slop and then $review with fixes, and finish with $sendit. Keep roadmap, PLAN.md, EXECMAP.md, and any repo-local progress docs truthful when stage work changes tracker truth, without creating extra tracker churn for routine status reports. Leave public release or publish scripts for me to run manually."
